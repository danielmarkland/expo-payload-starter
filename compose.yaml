services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: starter
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d starter']
      interval: 2s
      timeout: 5s
      retries: 30
    ports: ['127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ['mini', '-dir=/data', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${LOCAL_S3_ACCESS_KEY_ID:?Set LOCAL_S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${LOCAL_S3_SECRET_ACCESS_KEY:?Set LOCAL_S3_SECRET_ACCESS_KEY}
    ports: ['127.0.0.1:${LOCAL_STORAGE_PORT:-59000}:8333']
    volumes: [storage-data:/data]
volumes:
  postgres-data:
  storage-data:
