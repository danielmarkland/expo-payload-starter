name: CI
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
    secrets:
      PACKAGE_READ_TOKEN:
        required: false
permissions:
  contents: read
  packages: read
  deployments: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      documentation: ${{ steps.change.outputs.documentation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/release/*.test.mjs
      - id: change
        run: node scripts/release/policy.mjs
        env:
          RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
          GH_TOKEN: ${{ github.token }}
  quality:
    needs: policy
    if: inputs.force || needs.policy.outputs.documentation != 'true'
    runs-on: ubuntu-latest
    env:
      PRODUCT_AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/starter_product_identity_test
      AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/better_auth_migration_test
      SITE_TRANSFER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/publishing_site_transfer_tests
      SITE_TRANSFER_REPAIR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/publishing_site_transfer_repair_tests
      SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      EXPO_PUBLIC_SITE_URL: http://localhost:3000
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-key
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PAYLOAD_SECRET: local-ci-payload-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Install packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN" --location=user
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build shared publishing packages
        run: pnpm --filter '@starter/site^...' build
      - run: node scripts/release/packages.mjs
      - run: supabase start
      - name: Create isolated auth integration database
        run: >-
          pnpm --filter @danielmarkland/auth-runtime exec node --input-type=module -e
          "import { Pool } from 'pg'; const p=new Pool({connectionString:'postgresql://postgres:postgres@127.0.0.1:54322/postgres'}); await p.query('CREATE DATABASE better_auth_migration_test'); await p.query('CREATE DATABASE starter_product_identity_test'); await p.query('CREATE DATABASE publishing_site_transfer_tests'); await p.query('CREATE DATABASE publishing_site_transfer_repair_tests'); await p.end();"
      - run: pnpm payload:migrate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @starter/site test:site-transfer
      - run: pnpm build
      - name: Validate Expo configuration
        run: pnpm --filter @starter/app exec expo config --type public
      - name: Lint database schema
        run: supabase db lint --level error
      - name: Test database ownership and RLS
        run: supabase test db
      - name: Check generated Supabase types
        run: |
          supabase gen types typescript --local --schema app > /tmp/database.generated.ts
          pnpm exec prettier --config .prettierrc.json --write /tmp/database.generated.ts
          diff -u packages/data/src/database.ts /tmp/database.generated.ts

  e2e:
    needs: policy
    if: inputs.force || needs.policy.outputs.documentation != 'true'
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      PAYLOAD_SECRET: local-ci-payload-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Install packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN" --location=user
          pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Build shared publishing packages
        run: pnpm --filter '@starter/site^...' build
      - run: supabase start
      - run: pnpm payload:migrate
      - run: pnpm --filter @starter/site exec playwright install --with-deps chromium
      - run: pnpm --filter @danielmarkland/publishing-ui test:layout
      - run: pnpm --filter @starter/site test:e2e

  ci:
    if: always()
    needs: [policy, quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Required result
        env:
          POLICY: ${{ needs.policy.result }}
          QUALITY: ${{ needs.quality.result }}
          DOCS: ${{ needs.policy.outputs.documentation }}
          E2E: ${{ needs.e2e.result }}
        run: |
          test "$POLICY" = success
          if [ "$QUALITY" != success ]; then
            test "$DOCS" = true && test "$QUALITY" = skipped
          fi
          if [ "$QUALITY" = success ]; then test "$E2E" = success; else test "$E2E" = skipped; fi
