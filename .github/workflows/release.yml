name: Release shared packages

on:
  push:
    branches: [main]

concurrency:
  group: release-shared-packages
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@danielmarkland'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @danielmarkland/contracts test
      - run: pnpm --filter @danielmarkland/design-tokens test
      - run: pnpm --filter @danielmarkland/publishing-contracts test
      - run: pnpm --filter @danielmarkland/design-tokens build
      - run: pnpm --filter @danielmarkland/publishing-core test
      - run: pnpm --filter @danielmarkland/publishing-contracts build
      - run: NODE_OPTIONS=--no-experimental-webstorage pnpm --filter @danielmarkland/publishing-ui test
      - run: pnpm --filter @danielmarkland/publishing-ui test:package
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
